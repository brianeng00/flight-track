# XcodeGen spec. Generate the Xcode project on your Mac with:
#   brew install xcodegen && cd ios && xcodegen
# The .xcodeproj is gitignored; this file is the source of truth.
name: FlightTrack
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FlightCore:
    path: Packages/FlightCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(FT_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FlightTrack:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FlightCore
      - target: FlightTrackWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FT_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FlightTrack.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FlightTrack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(FT_BUNDLE_ID).refresh]
        NSLocationWhenInUseUsageDescription: "While a flight is being live-tracked, FlightTrack keeps location on so iOS lets it keep checking your flight in the background. On board, your phone's GPS also moves the plane on the Live Activity when there's no Wi-Fi."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Location keeps live flight tracking running in the background and places your plane on the map when you're on board."
        CFBundleURLTypes:
          - CFBundleURLName: flighttrack
            CFBundleURLSchemes: [flighttrack]
        FTAppGroup: $(FT_APP_GROUP)
        FTAeroDataBoxAPIMarketKey: $(ADB_APIMARKET_KEY)
        FTAeroDataBoxRapidAPIKey: $(ADB_RAPIDAPI_KEY)
        FTOpenSkyClientID: $(OPENSKY_CLIENT_ID)
        FTOpenSkyClientSecret: $(OPENSKY_CLIENT_SECRET)
    entitlements:
      path: App/FlightTrack.entitlements
      properties:
        com.apple.security.application-groups: [$(FT_APP_GROUP)]
  FlightTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: FlightCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FT_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/FlightTrackWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FlightTrack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FTAppGroup: $(FT_APP_GROUP)
    entitlements:
      path: Widget/FlightTrackWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(FT_APP_GROUP)]
schemes:
  FlightTrack:
    build:
      targets:
        FlightTrack: all
        FlightTrackWidget: all
    run:
      config: Debug
