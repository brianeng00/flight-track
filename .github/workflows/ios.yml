name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flightcore-linux:
    name: FlightCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Packages/FlightCore
        run: swift test --parallel
      - name: Demo flight through the engine
        working-directory: ios/Packages/FlightCore
        run: swift run flightcheck --demo

  flightcore-macos:
    name: FlightCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/Packages/FlightCore
        run: swift test
